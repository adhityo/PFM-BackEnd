version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
  settings:
    misspell:
      ignore-rules:
        - depositos # Indonesian domain term (resource path of table deposito)
        - commision # legacy column names agent_fee_transaction.*_commision (kept for data compatibility)
    gosec:
      excludes:
        - G115 # int conversions are bounded by validation before conversion
  exclusions:
    generated: strict
    paths:
      - internal/db/sqlc
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - pfm-backend
