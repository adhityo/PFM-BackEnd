version: "2"
sql:
  - engine: postgresql
    # One package over the four databases (PRD §7.1): the schema is the union of every
    # migration set, and each query file lives in the folder of the database it runs on.
    schema:
      - internal/db/migrations/shared
      - internal/db/migrations/outbox
      - internal/db/migrations/core
      - internal/db/migrations/security
      - internal/db/migrations/log
      - internal/db/migrations/document
    queries:
      - internal/db/queries/core
      - internal/db/queries/security
      - internal/db/queries/log
      - internal/db/queries/document
      - internal/db/queries/outbox
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              import: github.com/shopspring/decimal
              type: Decimal
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: inet
            nullable: true
            go_type:
              import: net/netip
              type: Addr
              pointer: true
          - db_type: jsonb
            nullable: true
            go_type:
              import: encoding/json
              type: RawMessage
